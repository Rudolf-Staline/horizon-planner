name: Pin dependencies once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pin-dependencies-once.yml"

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Pin top-level versions
        run: |
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))

          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] || {})) {
              const entry = lock.packages['node_modules/' + name]
              if (!entry?.version) {
                throw new Error('Resolved version missing for ' + name)
              }
              pkg[section][name] = entry.version
            }
          }

          fs.writeFileSync(
            'package.json',
            JSON.stringify(pkg, null, 2) + '\n',
          )
          NODE

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove one-time workflow
        run: rm .github/workflows/pin-dependencies-once.yml

      - name: Commit lockfile and pinned versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/pin-dependencies-once.yml
          git commit -m "build: pin validated npm dependency graph"
          git push
